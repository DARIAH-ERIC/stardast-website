# Replaces the values generated by `dariah-eric/gl-autodevops-minimal-port`'s `deploy.yml`, which probe the app root,
# and configure an nginx ingress. Placeholders are substituted with `envsubst` by that workflow.
#
# Keep a single replica: caches and their invalidation are in-process.
replicaCount: 1
image:
  repository: $repository
  tag: "$tag"
  pullPolicy: Always
  secrets: []
extraLabels:
  "ID": "$service_id"
gitlab:
  app: "$app_name"
  envURL: "$repo_url"
service:
  enabled: true
  name: "web"
  url: "$public_url"
  # Gets the apex domain onto the certificate and into the ingress rules, so it can be redirected to `www.` over https.
  additionalHosts:
    - "stardast.eu"
  type: ClusterIP
  externalPort: 3000
  internalPort: 3000
ingress:
  enabled: true
  path: "/"
  # Set explicitly: the cluster's default class is `rke2-ingress-nginx-migration`, which ignores `traefik.ingress.*`
  # annotations, so its responses are not compressed. Plain traefik has no request body limit by default, so uploads
  # through the server, up to `CMS_MAX_UPLOAD_SIZE`, need no annotation. `traefik-proxy-protocol` is only needed for the
  # clients' ip addresses, which the app does not use.
  className: "traefik"
  annotations:
    acme.cert-manager.io/http01-ingress-ingressclassname: "traefik"
    # For domains outside `*.oeaw.ac.at`, e.g. `www.stardast.eu`.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # `redirect-to-www` adds `www.` to every host of this ingress, so it must only list the apex and `www.` hosts.
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-to-www@kubernetescrd,kube-system-compress@kubernetescrd
livenessProbe:
  path: "/api/health/live"
  initialDelaySeconds: 5
  timeoutSeconds: 3
  scheme: "HTTP"
  probeType: "httpGet"
readinessProbe:
  path: "/api/health/ready"
  initialDelaySeconds: 5
  timeoutSeconds: 3
  scheme: "HTTP"
  probeType: "httpGet"
