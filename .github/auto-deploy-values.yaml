# Replaces the values generated by `dariah-eric/gl-autodevops-minimal-port`'s `deploy.yml`, which probe the app root,
# and configure an nginx ingress. Placeholders are substituted with `envsubst` by that workflow.
#
# Keep a single replica: caches and their invalidation are in-process.
replicaCount: 1
image:
  repository: $repository
  tag: "$tag"
  pullPolicy: Always
  secrets: []
extraLabels:
  "ID": "$service_id"
gitlab:
  app: "$app_name"
  envURL: "$repo_url"
service:
  enabled: true
  name: "web"
  url: "$public_url"
  type: ClusterIP
  externalPort: 3000
  internalPort: 3000
ingress:
  enabled: true
  path: "/"
  # Without a class name, the cluster's default ingress class is used - traefik, which has no request body limit by
  # default, so uploads through the server, up to `CMS_MAX_UPLOAD_SIZE`, need no annotation. `traefik-proxy-protocol` is
  # only needed for the clients' ip addresses, which the app does not use.
  annotations:
    # For `*.oeaw.ac.at` domains.
    cert-manager.io/cluster-issuer: "acdh-prod"
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-compress@kubernetescrd
livenessProbe:
  path: "/api/health/live"
  initialDelaySeconds: 5
  timeoutSeconds: 3
  scheme: "HTTP"
  probeType: "httpGet"
readinessProbe:
  path: "/api/health/ready"
  initialDelaySeconds: 5
  timeoutSeconds: 3
  scheme: "HTTP"
  probeType: "httpGet"
