name: Screen reader

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-screen-reader"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Not part of the validate workflow, so that it does not hold up deployments: screen reader tests are slow, and
# occasionally flaky.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "content/**"
  workflow_dispatch:

jobs:
  nvda:
    name: NVDA
    # Nvda only runs on windows.
    runs-on: windows-2025
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      PUBLIC_APP_BASE_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # `setup-bun` only reads `packageManager` and `engines.bun` from `package.json`, not `engines.runtime`.
      - name: Read bun version
        id: bun
        run: |
          # The minimum version of `engines.runtime`, e.g. `1.4.4` for `^1.4.4` or `~1.4.4`.
          version="$(jq -er '.engines.runtime.version | sub("^[\\^~]"; "") | select(test("^\\d+\\.\\d+\\.\\d+$"))' package.json)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Use bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "${{ steps.bun.outputs.version }}"

      - name: Use node
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Configures windows for screen reader automation, e.g. so that nvda may be started without prompts.
      - name: Set up screen reader automation
        run: bunx @guidepup/setup@0.29.3 setup --ci

      # The nvda build and add-on which match the installed version of `@guidepup/guidepup`.
      - name: Install nvda
        run: bunx @guidepup/setup@0.29.3 install nvda

      # The toolbar is part of every page in `astro dev`, and would be read out along with the page.
      - name: Disable astro dev toolbar
        run: bun run --bun astro preferences disable devToolbar

      - name: Test
        run: bun run test:e2e:nvda

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nvda-report
          path: playwright-report/
          retention-days: 14
